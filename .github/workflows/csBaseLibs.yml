        from csorchestratorsdk.portable.package_version import CMakeConfigPackageVersionGrep, PackageVersion
        from csorchestratorsdk.portable.release_manifest import get_package_versions_and_write_single_variant_manifest

        repos_config_file_list = []
        repos_auto_search_list = ['csCore', 'csLie', 'csCamera', 'csVisOpenGL']
        repos_version = []
        base_install_dir = Path('workspace/install')
        install_subdir = Path('csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}')
        variant_string = 'csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}'
        project_name = 'csBaseLibs'
        project_version = '0.1.0'
        output_file = Path('workspace/install/csBaseLibs-0.1.0-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}.csOrchestratorManifest')

        errors_list = get_package_versions_and_write_single_variant_manifest(
            repos_config_file_list=repos_config_file_list,
            repos_auto_search_list=repos_auto_search_list,
            repos_version=repos_version,
            base_install_dir=base_install_dir,
            install_subdir=install_subdir,
            variant_string=variant_string,
            project_name=project_name,
            project_version=project_version,
            output_file=output_file,
        )

        if len(errors_list) > 0:
