          cpp_compiler: clang++
        - execution_id: '8'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvc
          compiler_version: default
          generator: msvc2022
          generator_type: multiconfig
          generator_cmake: Visual Studio 17 2022
          runner: windows-2022
        - execution_id: '9'
          os: windows
