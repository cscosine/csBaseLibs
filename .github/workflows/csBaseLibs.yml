        - execution_id: '11'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvcclang
          compiler_version: default
          generator: msvc2026
          generator_type: multiconfig
          generator_cmake: Visual Studio 18 2026
          runner: windows-2025-vs2026
          toolset: ClangCL
    steps:
    - name: Repo git self-checkout
      uses: actions/checkout@v6
    - name: csCMake Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/csCMake.git
        path: workspace/csCMake
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: csCore Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/csCore.git
        path: workspace/csCore
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: csLie Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/csLie.git
        path: workspace/csLie
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: csCamera Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/csCamera.git
        path: workspace/csCamera
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: csVisOpenGL Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/csVisOpenGL.git
        path: workspace/csVisOpenGL
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: Run command install apt packages
      run: |-
        set -euo pipefail # enable strict mode


        packages=(
          libgl1-mesa-dev
          libopengl-dev
          mesa-common-dev
        )

        missing=()

        for pkg in "${packages[@]}"; do
          dpkg -s "$pkg" &>/dev/null || missing+=("$pkg")
        done

        if [ ${#missing[@]} -ne 0 ]; then

          sudo apt update

          echo "Need to install missing packages: ${missing[*]}"
          sudo apt install -y "${missing[@]}"
        else
          echo "All packages already installed."
        fi
      if: ${{ matrix.os == 'linux' && startsWith(matrix.os_version, 'ubuntu') }}
      shell: bash
    - name: cmake workflow on csCore CMake Workflow for config(s) debug-release-relWithDebInfo-paranoid
      run: |-
        set -e
        if [[ "${{ matrix.generator_type }}" == "singleconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-debug
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-relWithDebInfo
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-paranoid
        elif [[ "${{ matrix.generator_type }}" == "multiconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-debug-release-relWithDebInfo-paranoid
        else
          echo "Unknown generator_type: ${{ matrix.generator_type }}"
          exit 1
        fi
      shell: bash
      working-directory: workspace/csCore
