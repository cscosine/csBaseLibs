name: csBaseLibs
'on':
  push:
    branches:
    - main
    - dev
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
  schedule:
  - cron: 0 3 * * 1
jobs:
  release-from-artifacts:
    needs: orchestrator-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Repo Self Checkout
      uses: actions/checkout@v6
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Show downloaded files
      run: find artifacts -type f
    - name: Manifest creation
      run: |-
        import os  # noqa: F401 keep even if locally unused, necessary with variable subst
        import sys
        from pathlib import Path
        from typing import cast

        from csorchestratorsdk.portable.release_manifest import (
            collect_release_manifest_single_variant_and_prepare_manifest,
        )

        input_manifest_path_variant = [(Path('csBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig/csBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig'), (Path('csBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig/csBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig'), (Path('csBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja/csBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja'), (Path('csBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja/csBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja'), (Path('csBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig/csBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig'), (Path('csBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig/csBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig'), (Path('csBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja/csBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja'), (Path('csBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja/csBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja'), (Path('csBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022/csBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvc-default-msvc2022'), (Path('csBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026/csBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvc-default-msvc2026'), (Path('csBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022/csBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvcclang-default-msvc2022'), (Path('csBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026/csBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvcclang-default-msvc2026')]
        output_filepath = Path('csBaseLibs-0.1.0.csOrchestratorManifest')
        project_name = 'csBaseLibs'
        project_version = "__PROJECT_VERSION__"
        base_path_additional_files = Path(os.environ["GITHUB_WORKSPACE"])
        list_additional_files = [Path('csBaseLibs/cs_orchestrator_config.py')]
        output_folder_additional_files = Path('.')
        output_bundle_file_name = Path('csBaseLibs-0.1.0-bundle.tar.gz')

        errors_list = collect_release_manifest_single_variant_and_prepare_manifest(
            input_manifest_path_variant=input_manifest_path_variant,
            output_filepath=output_filepath,
            project_name=project_name,
            project_version=project_version,
            base_path_additional_files=base_path_additional_files,
            list_additional_files=list_additional_files,
            output_folder_additional_files=output_folder_additional_files,
            output_bundle_file_name=output_bundle_file_name,
        )

        if len(errors_list) > 0:
            for e in errors_list:
                print(e)
            sys.exit("ERROR: getting package versions")
      shell: python
      env:
        PYTHONPATH: ${{ github.workspace }}
      working-directory: artifacts
    - name: Upload manifest as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: manifest.csOrchestratorManifest
        path: |-
          artifacts/**/*.csOrchestratorManifest
    - name: Upload additional file csBaseLibs-0.1.0-bundle.tar.gz as artifact
      uses: actions/upload-artifact@v7
      with:
        name: csBaseLibs-0.1.0-bundle.tar.gz
        path: |-
          artifacts/csBaseLibs-0.1.0-bundle.tar.gz
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |-
          artifacts/**/*.tar.gz
          artifacts/**/*.csOrchestratorManifest
          artifacts/csBaseLibs-0.1.0-bundle.tar.gz
      if: ${{ github.ref_type == 'tag' }}
  orchestrator-matrix:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - execution_id: '0'
          os: linux
          os_version: ubuntu22.04
          architecture: x64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-22.04
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '1'
          os: linux
          os_version: ubuntu22.04
          architecture: x64
          architecture_variant: generic
          compiler: clang
